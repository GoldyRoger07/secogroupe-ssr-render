@if (visible) {
  <div
    role="alert"
    class="rounded-lg px-4 py-3 flex items-start gap-3 text-sm font-medium transition-all"
    [class]="
      type === 'success'
        ? 'bg-green-50 border border-green-400 text-green-800'
        : 'bg-red-50 border border-red-400 text-red-800'
    "
  >
    @if (type === 'success') {
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    }
    <span>{{ message }}</span>
  </div>
}
